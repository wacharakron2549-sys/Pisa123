<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PISA SPARK - เลือกวิชา</title>
    <!-- ฟอนต์แนวการ์ตูน -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            font-family: 'Mali', cursive, sans-serif;

            /* ค่าเริ่มต้น: จอคอมพิวเตอร์ (ใช้ bg3.png แนวนอน) */
            background-image: url('bg3.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* --- ปุ่มเปิด/ปิดเสียง (มุมบนขวา) --- */
        .music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #ffffff;
            border: 3px solid #222222;
            border-radius: 50%;
            box-shadow: 0 4px 0 #222222, 0 6px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            outline: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            z-index: 100;
            user-select: none;
        }

        .music-btn:hover {
            transform: scale(1.08);
        }

        .music-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #222222;
        }

        /* --- คอนเทนเนอร์ปุ่มเลือกวิชา (สำหรับคอมพิวเตอร์) --- */
        .category-container {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 20;
            width: 90%;
            max-width: 900px;
        }

        /* สไตล์ปุ่มกด 3D */
        .subject-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            padding: 14px 24px;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            border: 3.5px solid #ffffff;
            border-radius: 50px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            flex: 1;
            min-width: 180px;
            max-width: 260px;
        }

        /* ปุ่มวิทยาศาสตร์ (เขียว) */
        .btn-science {
            background: linear-gradient(180deg, #2ed573 0%, #10ac84 100%);
            box-shadow: 0 7px 0 #0a6950, 0 10px 15px rgba(0, 0, 0, 0.3);
        }

        /* ปุ่มคณิตศาสตร์ (ฟ้า) */
        .btn-math {
            background: linear-gradient(180deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 7px 0 #1c5982, 0 10px 15px rgba(0, 0, 0, 0.3);
        }

        /* ปุ่มการอ่าน (ส้มอมชมพู) */
        .btn-reading {
            background: linear-gradient(180deg, #ff7675 0%, #d63031 100%);
            box-shadow: 0 7px 0 #8b1d1e, 0 10px 15px rgba(0, 0, 0, 0.3);
        }

        .subject-btn:hover {
            transform: translateY(-4px) scale(1.03);
        }

        .subject-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5) !important;
        }

        .icon {
            font-size: 24px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }

        /* ========================================================
           📱 ปรับการแสดงผลสำหรับโทรศัพท์มือถือ (หน้าจอแนวตั้ง / กว้าง < 768px)
           ======================================================== */
        @media (max-width: 768px), (orientation: portrait) {
            body {
                /* สลับไปใช้รูปภาพแนวตั้ง bg-mobile.png */
                background-image: url('bg-mobile.png');
                background-position: center top;
                background-size: cover;
            }

            .music-btn {
                top: 15px;
                right: 15px;
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            /* จัดเรียงปุ่มเป็นแนวตั้ง เรียงลงมาตรงช่วงล่างหน้าจอ */
            .category-container {
                bottom: 25px;
                flex-direction: column;
                gap: 12px;
                width: 82%;
                max-width: 320px;
            }

            .subject-btn {
                width: 100%;
                max-width: 100%;
                padding: 10px 18px;
                font-size: 18px;
                border-radius: 40px;
                border-width: 3px;
                box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3);
            }

            .icon {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ปุ่มเปิด/ปิดเสียง -->
    <button id="musicToggle" class="music-btn" title="เปิด/ปิดเสียง">🔊</button>

    <!-- ไฟล์เพลง -->
    <audio id="bgMusic" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- ปุ่มเลือกวิชา -->
    <div class="category-container">
        <a href="science.html" class="subject-btn btn-science">
            <span class="icon">🧪</span>
            <span>วิทยาศาสตร์</span>
        </a>

        <a href="math.html" class="subject-btn btn-math">
            <span class="icon">📐</span>
            <span>คณิตศาสตร์</span>
        </a>

        <a href="read.html" class="subject-btn btn-reading">
            <span class="icon">📖</span>
            <span>การอ่าน</span>
        </a>
    </div>

    <!-- สคริปต์ควบคุมเสียงเพลง -->
    <script>
        const audio = document.getElementById('bgMusic');
        const toggleBtn = document.getElementById('musicToggle');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                toggleBtn.textContent = '🔇';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    toggleBtn.textContent = '🔊';
                    isPlaying = true;
                }).catch(err => console.log(err));
            }
        }

        toggleBtn.addEventListener('click', toggleAudio);

        // เล่นเพลงอัตโนมัติเมื่อกดหน้าจอครั้งแรก
        function startOnFirstClick() {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    toggleBtn.textContent = '🔊';
                }).catch(() => {});
            }
            document.removeEventListener('click', startOnFirstClick);
        }
        document.addEventListener('click', startOnFirstClick);
    </script>
</body>
</html>
